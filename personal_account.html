<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Keleshek</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f9fa;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: #ffffff;
      padding: 20px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaeaea;
    }
    .logo img {
      height: 50px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .language-selector, .notifications, .user-icon {
      display: flex;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
    }
    .user-icon img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h2 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      color: #004d40;
    }
    .roadmap-svg-container {
      background: linear-gradient(135deg, #00695c, #004d40);
      padding: 60px;
      border-radius: 30px;
      color: white;
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      margin-top: 40px;
    }
    svg {
      width: 100%;
      height: auto;
    }
    .milestone-label {
      font-size: 18px;
      font-weight: 600;
      fill: #ffffff;
    }
    .milestone-icon {
      font-size: 28px;
      fill: white;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <a href="index.html"><img src="logo.jpg" alt="Keleshek logo"></a>
  </div>
  <div class="header-actions">
    <div class="language-selector">
      <span style="margin-right: 8px;">🌐</span> English ▼
    </div>
    <div class="notifications" style="position: relative;">
      <img src="free-icon-bell-6824079.png" style="width: 24px;" onclick="toggleNotificationPanel()">
      <div id="notificationListWrapper">
        <h4>Notifications</h4>
        <div id="notificationList"></div>
      </div>
    </div>
    <div class="user-icon">
      <img id="headerProfileImage" src="profilesite.png" alt="Profile Icon">
    </div>
  </div>
</header>

<div class="container">
  <h2>Your Career Roadmap</h2>

  <div class="roadmap-svg-container">
    <svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg">
      <!-- Curved Path -->
      <path d="M 100 400 C 400 100, 700 100, 1000 400 S 1500 700, 1600 400" fill="none" stroke="#00e5a0" stroke-width="12" stroke-linecap="round" stroke-dasharray="5,5"/>

      <!-- Milestones -->
      <circle cx="100" cy="400" r="25" fill="#fff" stroke="#009688" stroke-width="6"/>
      <circle cx="400" cy="175" r="25" fill="#fff" stroke="#009688" stroke-width="6"/>
      <circle cx="700" cy="400" r="25" fill="#fff" stroke="#009688" stroke-width="6"/>
      <circle cx="1000" cy="625" r="25" fill="#fff" stroke="#009688" stroke-width="6"/>
      <circle cx="1300" cy="400" r="25" fill="#fff" stroke="#009688" stroke-width="6"/>

      <!-- Labels -->
      <text x="100" y="375" class="milestone-label" text-anchor="middle">Excel & SQL</text>
      <text x="400" y="150" class="milestone-label" text-anchor="middle">Power BI</text>
      <text x="700" y="375" class="milestone-label" text-anchor="middle">Projects</text>
      <text x="1000" y="600" class="milestone-label" text-anchor="middle">CV & LinkedIn</text>
      <text x="1300" y="375" class="milestone-label" text-anchor="middle">Apply to jobs</text>

      <!-- Icons (emoji fallback) -->
      <text x="100" y="345" text-anchor="middle" class="milestone-icon">📊</text>
      <text x="400" y="120" text-anchor="middle" class="milestone-icon">📈</text>
      <text x="700" y="345" text-anchor="middle" class="milestone-icon">💻</text>
      <text x="1000" y="570" text-anchor="middle" class="milestone-icon">📄</text>
      <text x="1300" y="345" text-anchor="middle" class="milestone-icon">🧑‍💼</text>
    </svg>
  </div>
</div>
</body>
</html>
