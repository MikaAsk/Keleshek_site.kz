<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Keleshek</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f9fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ffffff;
      padding: 20px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaeaea;
    }
    .logo img {
      height: 50px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .user-icon img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .btn {
      background: #009688;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .roadmap-section {
      margin-top: 40px;
      background: url('4f6729fe-0f73-4432-b1e5-b7ae1715d484.png') no-repeat center center;
      background-size: cover;
      height: 400px;
      position: relative;
      border-radius: 12px;
    }
    .step-marker {
      position: absolute;
      background: white;
      border: 2px solid #009688;
      padding: 10px;
      border-radius: 50%;
      font-weight: bold;
      text-align: center;
      width: 60px;
      height: 60px;
      line-height: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .step-marker.completed {
      background: #009688;
      color: white;
      border-color: #00796b;
    }
  </style>
</head>
<body>
<header>
  <div class="logo"><img src="logo.jpg" alt="Keleshek logo" /></div>
  <div class="header-actions">
    <div class="user-icon"><img id="headerProfileImage" src="profilesite.png" alt="Profile Icon"></div>
  </div>
</header>

<div class="container">
  <h2>User Profile</h2>
  <div style="display: flex; gap: 24px;">
    <div style="text-align: center;">
      <img id="profileImage" src="profilesite.png" class="profile-pic" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
      <br>
      <label class="btn" for="uploadImage" style="margin-top: 10px;">📷 Upload</label>
      <input type="file" id="uploadImage" style="display: none;">
    </div>
    <div style="flex-grow: 1;">
      <div class="form-field"><label>Full Name</label><input id="name"></div>
      <div class="form-field"><label>Age</label><input id="age"></div>
      <div class="form-field"><label>City</label><input id="city"></div>
      <div class="form-field"><label>Education Level</label>
        <select id="education">
          <option value="">--Select--</option>
          <option>High School</option>
          <option>College</option>
          <option>Bachelor</option>
          <option>Master</option>
        </select>
      </div>
      <div class="form-field"><label>Interests</label><input id="interests"></div>
      <div class="form-field"><label>Career Goal</label><input id="goal"></div>
      <div class="form-field"><label>Skills</label><textarea id="skills"></textarea></div>
      <button class="btn" onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <h2 style="margin-top: 60px;">Career Roadmap</h2>
  <div class="roadmap-section" id="roadmapSection"></div>
  <div style="text-align:center; margin-top: 20px;">
    <button class="btn" onclick="addStep()">➕ Add Step</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCbuYE-O7IGEnipj9TmZs997DvTqa-kElg",
    authDomain: "kelesheksite.firebaseapp.com",
    projectId: "kelesheksite",
    storageBucket: "kelesheksite.appspot.com",
    messagingSenderId: "283421011476",
    appId: "1:283421011476:web:8a77d738f81ed1ca450101"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser;
  let completedSteps = [];
  let stepCount = 5;
  const roadmapSection = document.getElementById("roadmapSection");

  let steps = [
    { top: "60px", left: "50px", icon: "📊", label: "Excel & SQL" },
    { top: "120px", left: "180px", icon: "📈", label: "Power BI" },
    { top: "90px", left: "320px", icon: "💻", label: "Projects" },
    { top: "140px", left: "470px", icon: "📄", label: "CV" },
    { top: "100px", left: "620px", icon: "🧑‍💼", label: "Jobs" }
  ];

  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'login.html';
    } else {
      currentUser = user;
      loadProfile();
      loadSteps();
    }
  });

  async function saveProfile() {
    const data = {
      name: document.getElementById('name').value,
      age: document.getElementById('age').value,
      city: document.getElementById('city').value,
      education: document.getElementById('education').value,
      interests: document.getElementById('interests').value.split(',').map(s => s.trim()),
      goal: document.getElementById('goal').value,
      skills: document.getElementById('skills').value
    };
    await db.collection('users').doc(currentUser.uid).set(data, { merge: true });
    alert(\"Profile saved successfully!\");
  }

  async function loadProfile() {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      const d = doc.data();
      document.getElementById('name').value = d.name || '';
      document.getElementById('age').value = d.age || '';
      document.getElementById('city').value = d.city || '';
      document.getElementById('education').value = d.education || '';
      document.getElementById('interests').value = d.interests?.join(', ') || '';
      document.getElementById('goal').value = d.goal || '';
      document.getElementById('skills').value = d.skills || '';
    }
  }

  async function loadSteps() {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists && doc.data().stepsCompleted) {
      completedSteps = doc.data().stepsCompleted;
    } else {
      completedSteps = Array(steps.length).fill(false);
    }
    renderSteps();
  }

  function renderSteps() {
    roadmapSection.innerHTML = '';
    steps.forEach((step, index) => {
      const div = document.createElement(\"div\");
      div.className = \"step-marker\" + (completedSteps[index] ? \" completed\" : \"\");
      div.id = `step-${index}`;
      div.style.top = step.top;
      div.style.left = step.left;
      div.innerHTML = `${index + 1}<br>${step.icon}<br><span style='font-size:10px;'>${step.label}</span>`;
      div.onclick = () => toggleStep(index);
      roadmapSection.appendChild(div);
    });
  }

  async function toggleStep(index) {
    completedSteps[index] = !completedSteps[index];
    await saveSteps();
    renderSteps();
  }

  function addStep() {
    const icon = prompt(\"Enter emoji or symbol for the new step:\", \"🌟\");
    if (!icon) return;
    const label = prompt(\"Enter a short label/title for the step:\", \"Custom Step\");
    if (!label) return;
    const lastLeft = parseInt(steps[steps.length - 1].left);
    steps.push({ top: \"120px\", left: `${lastLeft + 140}px`, icon, label });
    completedSteps.push(false);
    stepCount++;
    renderSteps();
    saveSteps();
  }

  async function saveSteps() {
    await db.collection('users').doc(currentUser.uid).set({ stepsCompleted: completedSteps }, { merge: true });
  }

  document.getElementById('uploadImage').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('profileImage').src = e.target.result;
        document.getElementById('headerProfileImage').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  });
</script>
</body>
</html>
