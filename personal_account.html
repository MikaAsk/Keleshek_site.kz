<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Keleshek</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f9fa;
    }

    header {
      background: #ffffff;
      padding: 20px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaeaea;
    }

    .logo img {
      height: 50px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .language-selector, .notifications, .user-icon {
      display: flex;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
    }

    .language-selector img,
    .notifications img,
    .user-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #0b2d5c;
      color: white;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    h2 {
      margin-bottom: 20px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .form-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .form-field input[type="file"] {
      padding: 6px;
    }

    .roadmap-section {
      margin-top: 40px;
    }

    .step {
      background: #e6f6f3;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .btn {
      background: #009688;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .profile-section {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 32px;
    }

    .profile-image-wrapper {
      flex-shrink: 0;
      text-align: center;
    }

    .profile-pic {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .form-fields {
      flex-grow: 1;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <a href="index.html"><img src="profilesite.png" alt="Keleshek logo"></a>
  </div>
  <div class="header-actions">
    <div class="language-selector">
      <span style="margin-right: 8px;">🌐</span> English ▼
    </div>
    <div class="notifications">
      <span style="font-size: 20px;">🔔</span>
    </div>
    <div class="user-icon">A</div>
  </div>
</header>

<div class="container">
  <h2>User Profile</h2>
  <div class="profile-section">
    <div class="profile-image-wrapper">
      <img src="profilesite.png" id="profileImage" class="profile-pic" alt="Profile picture">
      <input type="file" id="uploadImage">
    </div>
    <div class="form-fields">
      <div class="form-field"><label>Full Name</label><input id="name"></div>
      <div class="form-field"><label>Age</label><input id="age"></div>
      <div class="form-field"><label>City</label><input id="city"></div>
      <div class="form-field"><label>Education Level</label>
        <select id="education">
          <option value="">--Select--</option>
          <option>High School</option>
          <option>College</option>
          <option>Bachelor</option>
          <option>Master</option>
        </select>
      </div>
      <div class="form-field"><label>Interests</label><input id="interests"></div>
      <div class="form-field"><label>Career Goal</label><input id="goal"></div>
      <div class="form-field"><label>Skills</label><textarea id="skills"></textarea></div>
      <button class="btn" onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <div class="roadmap-section">
    <h2>Your Career Roadmap</h2>
    <button class="btn" onclick="generateRoadmap()">Generate Roadmap</button>
    <div id="roadmap"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCbuYE-O7IGEnipj9TmZs997DvTqa-kElg",
    authDomain: "kelesheksite.firebaseapp.com",
    projectId: "kelesheksite",
    storageBucket: "kelesheksite.appspot.com",
    messagingSenderId: "283421011476",
    appId: "1:283421011476:web:8a77d738f81ed1ca450101"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();
  let currentUser;

  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'login.html';
    } else {
      currentUser = user;
      loadProfile();
    }
  });

  function logout() {
    auth.signOut().then(() => location.href = 'login.html');
  }

  async function saveProfile() {
    const profileData = {
      name: document.getElementById('name').value,
      age: document.getElementById('age').value,
      city: document.getElementById('city').value,
      education: document.getElementById('education').value,
      interests: document.getElementById('interests').value.split(',').map(s => s.trim()),
      goal: document.getElementById('goal').value,
      skills: document.getElementById('skills').value
    };

    await db.collection('users').doc(currentUser.uid).set(profileData);

    const file = document.getElementById('uploadImage').files[0];
    if (file) {
      const ref = storage.ref('profile_pics/' + currentUser.uid);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      document.getElementById('profileImage').src = url;
    }
    alert("Profile saved");
  }

  async function loadProfile() {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      const d = doc.data();
      document.getElementById('name').value = d.name || '';
      document.getElementById('age').value = d.age || '';
      document.getElementById('city').value = d.city || '';
      document.getElementById('education').value = d.education || '';
      document.getElementById('interests').value = d.interests?.join(', ') || '';
      document.getElementById('goal').value = d.goal || '';
      document.getElementById('skills').value = d.skills || '';
    }
    try {
      const url = await storage.ref('profile_pics/' + currentUser.uid).getDownloadURL();
      document.getElementById('profileImage').src = url;
    } catch (err) {
      document.getElementById('profileImage').src = 'default-avatar.png';
    }
  }

  function generateRoadmap() {
    const roadmap = document.getElementById('roadmap');
    roadmap.innerHTML = '';
    const steps = [
      "Master Excel and SQL",
      "Learn data visualization tools like Power BI",
      "Build 2-3 data projects",
      "Create a CV and LinkedIn profile",
      "Apply for internships or junior analyst jobs"
    ];
    steps.forEach((step, i) => {
      const div = document.createElement('div');
      div.className = 'step';
      div.innerText = `${i + 1}. ${step}`;
      roadmap.appendChild(div);
    });
  }
</script>
</body>
</html>
