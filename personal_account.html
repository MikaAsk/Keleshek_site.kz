<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Keleshek</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f9fa;
    }

    header {
      background: #ffffff;
      padding: 20px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaeaea;
    }

    .logo img {
      height: 50px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .language-selector, .notifications, .user-icon {
      display: flex;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
    }

    .user-icon img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .notification-panel {
      position: absolute;
      top: 34px;
      right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 260px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      display: none;
      padding: 12px;
      z-index: 1000;
    }

    .notification-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      font-size: 13px;
      color: #333;
    }

    .notification-list li {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    .notification-list li:last-child {
      border-bottom: none;
    }

    .notification-list .empty-msg {
      color: #777;
      font-style: italic;
    }

    .btn {
      background: #009688;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .form-field {
      margin-bottom: 16px;
    }

    .form-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <a href="index.html"><img src="logo.jpg" alt="Keleshek logo"></a>
  </div>
  <div class="header-actions">
    <div class="language-selector">
      <span style="margin-right: 8px;">🌐</span> English ▼
    </div>
    <div class="notifications" style="position: relative;">
      <img src="bell.png" style="width: 24px;" onclick="toggleNotificationPanel()" />
      <div id="notificationPanel" class="notification-panel">
        <strong style="display: flex; justify-content: space-between; align-items: center;">
          <span>Notifications</span>
          <button onclick="clearNotifications()" style="background: none; border: none; color: #009688; cursor: pointer; font-size: 12px;">🗑 Clear</button>
        </strong>
        <ul id="notificationList" class="notification-list">
          <li class="empty-msg">No notifications</li>
        </ul>
      </div>
    </div>
    <div class="user-icon">
      <img id="headerProfileImage" src="profilesite.png" alt="Profile Icon">
    </div>
  </div>
</header>

<div class="container">
  <h2>User Profile</h2>
  <div class="form-field"><label>Full Name</label><input id="name"></div>
  <div class="form-field"><label>Age</label><input id="age"></div>
  <div class="form-field"><label>City</label><input id="city"></div>
  <div class="form-field"><label>Education Level</label>
    <select id="education">
      <option value="">--Select--</option>
      <option>High School</option>
      <option>College</option>
      <option>Bachelor</option>
      <option>Master</option>
    </select>
  </div>
  <div class="form-field"><label>Interests</label><input id="interests"></div>
  <div class="form-field"><label>Career Goal</label><input id="goal"></div>
  <div class="form-field"><label>Skills</label><textarea id="skills"></textarea></div>
  <button class="btn" onclick="saveProfile()">Save Profile</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCbuYE-O7IGEnipj9TmZs997DvTqa-kElg",
    authDomain: "kelesheksite.firebaseapp.com",
    projectId: "kelesheksite",
    storageBucket: "kelesheksite.appspot.com",
    messagingSenderId: "283421011476",
    appId: "1:283421011476:web:8a77d738f81ed1ca450101"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let currentUser;

  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'login.html';
    } else {
      currentUser = user;
      loadNotifications();
      loadProfile();
    }
  });

  function toggleNotificationPanel() {
    const panel = document.getElementById('notificationPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }

  async function saveNotification(text) {
    if (!currentUser) return;
    const ref = db.collection('users').doc(currentUser.uid).collection('notifications');
    await ref.add({
      message: text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  async function addNotification(text) {
    const list = document.getElementById('notificationList');
    const empty = list.querySelector('.empty-msg');
    if (empty) empty.remove();

    const now = new Date();
    const formattedTime = now.toLocaleString();

    const li = document.createElement('li');
    li.innerHTML = `<div>${text}</div><small style="color:gray">${formattedTime}</small>`;
    list.prepend(li);

    await saveNotification(text);
  }

  async function loadNotifications() {
    if (!currentUser) return;
    const ref = db.collection('users').doc(currentUser.uid).collection('notifications').orderBy('timestamp', 'desc').limit(10);
    const snap = await ref.get();

    const list = document.getElementById('notificationList');
    list.innerHTML = '';

    if (snap.empty) {
      const li = document.createElement('li');
      li.className = 'empty-msg';
      li.innerText = 'No notifications';
      list.appendChild(li);
    } else {
      snap.forEach(doc => {
        const d = doc.data();
        const time = d.timestamp?.toDate().toLocaleString() || '';
        const li = document.createElement('li');
        li.innerHTML = `<div>${d.message}</div><small style='color:gray'>${time}</small>`;
        list.appendChild(li);
      });
    }
  }

  async function clearNotifications() {
    if (!currentUser) return;
    const ref = db.collection('users').doc(currentUser.uid).collection('notifications');
    const snap = await ref.get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    loadNotifications();
  }

  async function saveProfile() {
    if (!currentUser) return;
    const profileData = {
      name: document.getElementById('name').value,
      age: document.getElementById('age').value,
      city: document.getElementById('city').value,
      education: document.getElementById('education').value,
      interests: document.getElementById('interests').value.split(',').map(s => s.trim()),
      goal: document.getElementById('goal').value,
      skills: document.getElementById('skills').value
    };
    await db.collection('users').doc(currentUser.uid).set(profileData, { merge: true });
    addNotification("Profile saved successfully");
  }

  async function loadProfile() {
    if (!currentUser) return;
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      const d = doc.data();
      document.getElementById('name').value = d.name || '';
      document.getElementById('age').value = d.age || '';
      document.getElementById('city').value = d.city || '';
      document.getElementById('education').value = d.education || '';
      document.getElementById('interests').value = d.interests?.join(', ') || '';
      document.getElementById('goal').value = d.goal || '';
      document.getElementById('skills').value = d.skills || '';
    }
  }
</script>
</body>
</html>
