<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Keleshek</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f9fa;
    }
    header {
      background: #ffffff;
      padding: 20px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaeaea;
    }
    .logo img {
      height: 50px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .language-selector, .notifications, .user-icon {
      display: flex;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
    }
    .user-icon img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h2 {
      margin-bottom: 20px;
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .roadmap-section {
      margin-top: 40px;
      background: url('8802d775-fc25-438f-8203-0fdf8ecb3cce.png') no-repeat center center;
      background-size: cover;
      height: 400px;
      position: relative;
      border-radius: 12px;
    }
    .step-marker {
      position: absolute;
      background: white;
      border: 2px solid #009688;
      padding: 10px;
      border-radius: 50%;
      font-weight: bold;
      text-align: center;
      width: 60px;
      height: 60px;
      line-height: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .step-marker.completed {
      background: #009688;
      color: white;
      border-color: #00796b;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html"><img src="logo.jpg" alt="Keleshek logo"></a>
    </div>
    <div class="header-actions">
      <div class="language-selector">
        <span style="margin-right: 8px;">🌐</span> English ▼
      </div>
      <div class="notifications" style="position: relative;">
        <img src="free-icon-bell-6824079.png" style="width: 24px;" onclick="toggleNotificationPanel()">
        <div id="notificationListWrapper">
          <h4>Notifications</h4>
          <div id="notificationList"></div>
        </div>
      </div>
      <div class="user-icon">
        <img id="headerProfileImage" src="profilesite.png" alt="Profile Icon">
      </div>
    </div>
  </header>
  <div class="container">
    <h2>User Profile</h2>
    <div class="profile-section" style="display: flex; align-items: flex-start; gap: 24px;">
      <div class="profile-image-wrapper" style="text-align: center;">
        <img src="profilesite.png" id="profileImage" class="profile-pic" alt="Profile picture" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
        <div>
          <label for="uploadImage" class="upload-label" style="display: inline-block; margin-top: 8px; padding: 6px 12px; background-color: #eeeeee; border-radius: 6px; font-size: 13px; color: #333; cursor: pointer;">📷 Upload photo</label>
          <input type="file" id="uploadImage" style="display: none;">
        </div>
      </div>
      <div class="form-fields" style="flex-grow: 1;">
        <div class="form-field"><label>Full Name</label><input id="name"></div>
        <div class="form-field"><label>Age</label><input id="age"></div>
        <div class="form-field"><label>City</label><input id="city"></div>
        <div class="form-field"><label>Education Level</label>
          <select id="education">
            <option value="">--Select--</option>
            <option>High School</option>
            <option>College</option>
            <option>Bachelor</option>
            <option>Master</option>
          </select>
        </div>
        <div class="form-field"><label>Interests</label><input id="interests"></div>
        <div class="form-field"><label>Career Goal</label><input id="goal"></div>
        <div class="form-field"><label>Skills</label><textarea id="skills"></textarea></div>
        <button class="btn" onclick="saveProfile()" style="background: #009688; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 20px;">Save Profile</button>
      </div>
    </div>
    <div class="roadmap-section">
      <div class="step-marker" id="step-0" style="top: 60px; left: 50px;">1<br>📊</div>
      <div class="step-marker" id="step-1" style="top: 120px; left: 180px;">2<br>📈</div>
      <div class="step-marker" id="step-2" style="top: 90px; left: 320px;">3<br>💻</div>
      <div class="step-marker" id="step-3" style="top: 140px; left: 470px;">4<br>📄</div>
      <div class="step-marker" id="step-4" style="top: 100px; left: 620px;">5<br>🧑‍💼</div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCbuYE-O7IGEnipj9TmZs997DvTqa-kElg",
      authDomain: "kelesheksite.firebaseapp.com",
      projectId: "kelesheksite",
      storageBucket: "kelesheksite.appspot.com",
      messagingSenderId: "283421011476",
      appId: "1:283421011476:web:8a77d738f81ed1ca450101"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const stepCount = 5;
    let completedSteps = Array(stepCount).fill(false);
    let currentUser;

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        currentUser = user;
        loadProfile();
        loadCompletedSteps();
      }
    });

    async function loadProfile() {
      const doc = await db.collection('users').doc(currentUser.uid).get();
      if (doc.exists) {
        const d = doc.data();
        document.getElementById('name').value = d.name || '';
        document.getElementById('age').value = d.age || '';
        document.getElementById('city').value = d.city || '';
        document.getElementById('education').value = d.education || '';
        document.getElementById('interests').value = d.interests?.join(', ') || '';
        document.getElementById('goal').value = d.goal || '';
        document.getElementById('skills').value = d.skills || '';
      }
    }

    async function saveProfile() {
      if (!currentUser) return;
      const profileData = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        city: document.getElementById('city').value,
        education: document.getElementById('education').value,
        interests: document.getElementById('interests').value.split(',').map(s => s.trim()),
        goal: document.getElementById('goal').value,
        skills: document.getElementById('skills').value
      };
      try {
        await db.collection('users').doc(currentUser.uid).set(profileData, { merge: true });
        addNotification("✔ Profile saved successfully!");
      } catch (e) {
        console.error("Save error:", e);
        addNotification("❌ Error saving profile");
      }
    }

    async function loadCompletedSteps() {
      const doc = await db.collection('users').doc(currentUser.uid).get();
      if (doc.exists && doc.data().stepsCompleted) {
        completedSteps = doc.data().stepsCompleted;
      }
      renderMarkers();
    }

    function renderMarkers() {
      for (let i = 0; i < stepCount; i++) {
        const el = document.getElementById(`step-${i}`);
        if (completedSteps[i]) {
          el.classList.add('completed');
        }
        el.addEventListener('click', () => toggleStep(i));
      }
    }

    async function toggleStep(index) {
      completedSteps[index] = !completedSteps[index];
      await db.collection('users').doc(currentUser.uid).set({ stepsCompleted: completedSteps }, { merge: true });
      const el = document.getElementById(`step-${index}`);
      el.classList.toggle('completed');
    }

    function toggleNotificationPanel() {
      const wrapper = document.getElementById('notificationListWrapper');
      wrapper.style.display = wrapper.style.display === 'none' ? 'block' : 'none';
    }

    function addNotification(message) {
      const list = document.getElementById('notificationList');
      if (!list) return;
      const item = document.createElement('div');
      item.className = 'notification-item';
      item.textContent = message;
      list.prepend(item);
    }

    document.getElementById('uploadImage').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('profileImage').src = e.target.result;
          document.getElementById('headerProfileImage').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
